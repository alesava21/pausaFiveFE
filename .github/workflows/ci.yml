name: CI frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formattazione e lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0 --ignore-scripts
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:e2e:types

  verify:
    name: Test e build statica
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0 --ignore-scripts
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci
      - run: npm run build
      - name: Report unit test
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fe-unit-tests-${{ github.run_id }}
          path: test-results/unit.xml
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Sudoku UI Chromium e WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0 --ignore-scripts
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Report UI e screenshot fixture a320px
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fe-sudoku-e2e-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Vulnerabilità dipendenze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0 --ignore-scripts
      # Include le dipendenze dev: nessuna esclusione silenziosa del tooling.
      - run: npm audit --audit-level=high

  gate:
    name: CI frontend completata
    if: ${{ always() }}
    needs: [quality, verify, security, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Tutti i controlli devono riuscire
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$E2E_RESULT" = success
