# Esempio server statico: copiare dist/PausaFiveFE/browser nella root indicata.
# Le configurazioni API/proxy sono previste nei TASK-007/009.
server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    index index.html;

    error_page 404 /404/index.html;
    location = /404 { return 404; }
    location = /404/ { return 404; }
    location = /404/index.html { internal; }

    location / {
        try_files $uri/index.html $uri =404;
    }
}
